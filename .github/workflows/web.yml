name: Deploy web (PWA)

# Wersja na komputer (2026-11-13, user: "apka pod Windowsa... taski odznaczać,
# dodawać, statystyki"). Ten sam kod co APK, zbudowany na web (Expo, react-native-
# web) i opublikowany na GitHub Pages: https://sokkieltanin.github.io/sapp2/
# W Chrome/Edge: ikona "Zainstaluj" w pasku adresu → appka w osobnym oknie.
# Dane: to samo konto Google + synchronizacja przez Firestore (services/cloudSync.ts).
#
# Jednorazowo w repo: Settings → Pages → Source: "GitHub Actions".
# Jednorazowo w Firebase: Authentication → Settings → Authorized domains →
# dodaj "sokkieltanin.github.io" (inaczej okienko logowania Google odmówi).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Export web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
      - name: PWA (manifest, service worker, 404 dla podstron)
        run: node scripts/pwa-postbuild.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
